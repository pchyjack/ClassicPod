name: Build rootless deb
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg make xz

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build (rootless, for Dopamine)
        run: |
          export THEOS="$HOME/theos"
          THEOS_PACKAGE_SCHEME=rootless gmake package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicPod-deb
          path: packages/*.deb
